<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#eef8ff" />
  <title>泡泡球｜Bubble Pop</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');
    :root{font-family:'Nunito','Noto Sans TC',sans-serif;color:#153252;background:#eef8ff;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 18% 12%,#fff 0,transparent 35%),radial-gradient(ellipse at 92% 86%,#d9efff 0,transparent 38%),#eef8ff}
    .app{width:min(100%,440px);padding:23px 22px 18px;background:#ffffffc9;border:1px solid #fff;border-radius:28px;box-shadow:0 22px 60px #5085b321,0 3px 10px #5085b312;backdrop-filter:blur(12px)}
    .topline{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#86a1ba;font-weight:900;margin-bottom:3px}.title{font-size:28px;line-height:1.15;font-weight:900;letter-spacing:-.04em;margin:0;color:#183858}.title span{color:#49b8ed}.subtitle{margin:7px 0 0;color:#829ab0;font-size:12px;font-weight:700}.stats{display:flex;gap:8px}.stat{min-width:66px;padding:8px 11px;text-align:center;background:#f0f8ff;border-radius:14px}.stat small{display:block;color:#91a8bb;font-size:9px;font-weight:900;letter-spacing:.12em}.stat strong{display:block;font-size:17px;color:#234568;line-height:1.3}
    .board-wrap{position:relative;padding:9px;background:linear-gradient(145deg,#d9efff,#e7f6ff);border-radius:22px;box-shadow:inset 0 2px 6px #92b8d333}.board{position:relative;overflow:hidden;border-radius:15px;background:linear-gradient(180deg,#f8fdff,#ecf8ff);height:min(112vw,430px);max-height:430px;min-height:340px;touch-action:none;cursor:crosshair}.board:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#aacde21c 1px,transparent 1px);background-size:16px 16px;pointer-events:none}.bubble{position:absolute;border-radius:50%;width:36px;height:36px;transform:translate(-50%,-50%);box-shadow:inset -3px -5px 8px #11355720,inset 3px 3px 6px #ffffffb8,0 3px 5px #27577b21;z-index:2}.bubble:after{content:"";position:absolute;left:8px;top:6px;width:8px;height:5px;background:#ffffffad;border-radius:50%;transform:rotate(-35deg)}.bubble.shooter{z-index:4;width:40px;height:40px}.bubble.aim{width:8px;height:8px;opacity:.38;box-shadow:none;z-index:1}.bubble.aim:after{display:none}.line{position:absolute;height:2px;transform-origin:left center;background:repeating-linear-gradient(90deg,#83acc7 0 5px,transparent 5px 10px);z-index:1;pointer-events:none}.ceiling{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#8fb9d554,transparent);z-index:1}
    .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#edf8ffe0;backdrop-filter:blur(5px);z-index:10;text-align:center}.overlay.show{display:flex}.modal{padding:28px}.modal .emoji{font-size:37px}.modal h2{font-size:24px;margin:7px 0;color:#234568}.modal p{margin:0 0 17px;color:#7892a9;font-size:13px}.button{border:0;border-radius:13px;padding:11px 21px;background:#43b8ea;color:white;font:800 13px inherit;font-family:inherit;cursor:pointer;box-shadow:0 5px 12px #49afe746}.button:hover{transform:translateY(-1px);filter:brightness(1.03)}
    .bottom{display:flex;align-items:center;justify-content:space-between;padding:13px 3px 0}.hint{font-size:11px;color:#88a0b6;font-weight:700}.hint b{color:#557998}.reset{border:0;background:none;color:#6d91ad;font:800 11px inherit;font-family:inherit;cursor:pointer;padding:7px}.reset:hover{color:#328cb9}.next{display:inline-flex;vertical-align:middle;margin-left:5px;width:14px;height:14px;border-radius:50%;box-shadow:inset -2px -2px 3px #0002,inset 2px 2px 3px #fff9}
    @media(max-width:480px){body{padding:10px}.app{padding:19px 15px 13px;border-radius:23px}.title{font-size:25px}.board{height:min(112vw,430px);min-height:330px}.stat{min-width:58px;padding:7px 8px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topline"><div><div class="eyebrow">A little moment of joy</div><h1 class="title">泡泡<span>球</span></h1><p class="subtitle">瞄準・發射・把同色泡泡連在一起</p></div><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div></header>
    <section class="board-wrap"><div id="board" class="board" aria-label="泡泡球遊戲區"><div class="ceiling"></div><div id="aimline" class="line"></div><div id="overlay" class="overlay"><div class="modal"><div class="emoji" id="resultEmoji">✨</div><h2 id="resultTitle">做得好！</h2><p id="resultText">再來一局，繼續消除泡泡吧。</p><button id="playAgain" class="button">再玩一次</button></div></div></div></section>
    <footer class="bottom"><div class="hint">下一顆 <span id="nextBubble" class="next"></span><span style="margin-left:9px">點擊或拖曳瞄準</span></div><button id="restart" class="reset">↻ 重新開始</button></footer>
  </main>
  <script>
    (()=>{
      const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),nextEl=document.querySelector('#nextBubble'),line=document.querySelector('#aimline'),overlay=document.querySelector('#overlay');
      const colors=['#ff7185','#ffc857','#54c9a3','#54b9f2','#a78bfa'];
      const R=18,STEP=36,ROWS=7,COLS=10;
      let bubbles=[],score=0,best=Number(localStorage.getItem('bubble-best')||0),current=0,next=0,shots=0,ended=false,animating=false;
      bestEl.textContent=best;
      const dims=()=>({w:board.clientWidth,h:board.clientHeight});
      const pos=(r,c)=>({x: R+c*STEP+(r%2?R:0),y:R+r*STEP});
      function makeBubble(x,y,color,cls='') {const el=document.createElement('i');el.className='bubble '+cls;el.style.left=x+'px';el.style.top=y+'px';el.style.background=color;board.appendChild(el);return {x,y,color,el,row:-1,col:-1};}
      function randomColor(){return colors[Math.floor(Math.random()*colors.length)];}
      function updateHud(){scoreEl.textContent=score;nextEl.style.background=colors[next];}
      function setup(){board.querySelectorAll('.bubble').forEach(e=>e.remove());bubbles=[];score=0;shots=0;ended=false;animating=false;overlay.classList.remove('show');const {w}=dims();const cols=Math.min(COLS,Math.floor((w-R*2)/STEP)+1);for(let r=0;r<ROWS;r++)for(let c=0;c<cols;c++)if(r<5||Math.random()>.18){const p=pos(r,c);const b=makeBubble(p.x,p.y,randomColor());b.row=r;b.col=c;bubbles.push(b)}current=Math.floor(Math.random()*colors.length);next=Math.floor(Math.random()*colors.length);updateHud();}
      function neighbors(b){const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let rr=b.row+dr,cc=b.col+dc-(dr!==0&&b.row%2===0?1:0);const found=bubbles.find(x=>x.row===rr&&x.col===cc);if(found)out.push(found)}return out;}
      function connected(start,predicate){let seen=new Set([start]),stack=[start];while(stack.length){for(const n of neighbors(stack.pop()))if(!seen.has(n)&&predicate(n)){seen.add(n);stack.push(n)}}return [...seen];}
      function nearestCell(x,y){let bestCell=null,bestD=Infinity;const {w}=dims(),cols=Math.min(COLS,Math.floor((w-R*2)/STEP)+1);for(let r=0;r<16;r++)for(let c=0;c<cols;c++){const p=pos(r,c);if(bubbles.some(b=>b.row===r&&b.col===c))continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bestD){bestD=d;bestCell={r,c,...p}}}return bestCell;}
      function aim(e){if(ended||animating)return;const rect=board.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let dx=x-dims().w/2,dy=y-(dims().h-25);if(dy>-18)dy=-18;let a=Math.atan2(dy,dx);a=Math.max(-Math.PI+0.22,Math.min(-0.22,a));const len=58;line.style.left=(dims().w/2)+'px';line.style.top=(dims().h-25)+'px';line.style.width=len+'px';line.style.transform='rotate('+a+'rad)';}
      function shoot(e){if(ended||animating)return;const rect=board.getBoundingClientRect(),tx=e.clientX-rect.left,ty=e.clientY-rect.top;let dx=tx-dims().w/2,dy=ty-(dims().h-25);if(dy>-18)dy=-18;let angle=Math.atan2(dy,dx);angle=Math.max(-Math.PI+0.22,Math.min(-0.22,angle));animating=true;line.style.display='none';const b=makeBubble(dims().w/2,dims().h-25,colors[current],'shooter');const vx=Math.cos(angle)*8,vy=Math.sin(angle)*8;
        const tick=()=>{if(ended)return;b.x+=vx;b.y+=vy;if(b.x<R||b.x>dims().w-R){b.x=Math.max(R,Math.min(dims().w-R,b.x));b.el.style.left=b.x+'px'}b.el.style.top=b.y+'px';b.el.style.left=b.x+'px';const hit=bubbles.some(o=>Math.hypot(o.x-b.x,o.y-b.y)<=STEP-1);if(hit||b.y<=R+2){const cell=nearestCell(b.x,b.y);if(!cell){b.el.remove();animating=false;return}b.x=cell.x;b.y=cell.y;b.row=cell.r;b.col=cell.c;b.el.classList.remove('shooter');bubbles.push(b);const group=connected(b,n=>n.color===b.color);if(group.length>=3){group.forEach(x=>{x.el.remove();bubbles=bubbles.filter(y=>y!==x)});score+=group.length*10;const floating=bubbles.filter(x=>!connected(x,v=>v.row===0).includes(x));floating.forEach(x=>{x.el.remove();bubbles=bubbles.filter(y=>y!==x)});score+=floating.length*15}else{shots++;if(shots%5===0)dropRow()};current=next;next=Math.floor(Math.random()*colors.length);updateHud();animating=false;checkEnd();return}requestAnimationFrame(tick)};requestAnimationFrame(tick);
      }
      function dropRow(){const {w}=dims(),cols=Math.min(COLS,Math.floor((w-R*2)/STEP)+1);if(bubbles.some(b=>b.row>=14)){finish(false);return}for(const b of bubbles){b.row++;const p=pos(b.row,b.col);b.x=p.x;b.y=p.y;b.el.style.left=p.x+'px';b.el.style.top=p.y+'px'}for(let c=0;c<cols;c++){if(Math.random()<.82){const p=pos(0,c),b=makeBubble(p.x,p.y,randomColor());b.row=0;b.col=c;bubbles.push(b)}}}
      function checkEnd(){if(bubbles.some(b=>b.y>=dims().h-65)){finish(false);return}if(bubbles.length===0)finish(true)}
      function finish(win){ended=true;if(score>best){best=score;localStorage.setItem('bubble-best',best);bestEl.textContent=best}document.querySelector('#resultEmoji').textContent=win?'🎉':'🫧';document.querySelector('#resultTitle').textContent=win?'太厲害了！':'泡泡滿出來了';document.querySelector('#resultText').textContent=win?'完美清場！要不要再挑戰一次？':`這次拿下 ${score} 分，再來一局吧！`;overlay.classList.add('show')}
      board.addEventListener('pointermove',aim);board.addEventListener('pointerdown',e=>{if(e.target.closest('.modal'))return;shoot(e)});document.querySelector('#restart').addEventListener('click',setup);document.querySelector('#playAgain').addEventListener('click',setup);window.addEventListener('resize',()=>{if(!animating)setup()});setup();
    })();
  </script>
</body>
</html>
